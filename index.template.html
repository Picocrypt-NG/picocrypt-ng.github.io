	<style>
		*{
			font-family:"Segoe UI",Arial,sans-serif;
			color:#f5deb3;
			user-select:none;
		}
		body{
			margin:0;
			padding:0;
			display:flex;
			justify-content:center;
			align-items:center;
			width:100vw;
			height:100vh;
			background-color:#1d1f21;
		}
		body > div{
			display:flex;
			flex-direction:column;
			align-items:center;
			width:320px;
		}
		body > div > div{
			display:flex;
			align-items:center;
			justify-content:center;
			width:300px;
			height:80px;
			box-sizing:border-box;
			margin-bottom:12px;
			background-color:#30343c;
			border-radius:6px;
			font-size:17px;
			cursor:pointer;
		}
		body > div > div > p{
			text-overflow:ellipsis;
			white-space:nowrap;
			overflow:hidden;
			width:80%;
			text-align:center;
		}
		input[type="password"]{
			width:300px;
			height:32px;
			box-sizing:border-box;
			padding:4px 8px;
			margin-bottom:12px;
			border:none;
			border-radius:6px;
			outline:none;
			background-color:#30343c;
			color:#f5deb3;
			font-size:16px;
			font-family:inherit;
		}
		input[type="password"]::placeholder{
			color:#f5deb347;
		}
		input[type="submit"]{
			width:300px;
			height:32px;
			margin-bottom:6px;
			border:none;
			border-radius:6px;
			outline:none;
			background-color:#30343c;
			color:#f5deb3;
			font-size:16px;
			font-family:inherit;
			cursor:pointer;
		}
		.disabled{
			opacity:0.3;
			pointer-events:none;
		}
		#footer{
			position:absolute;
			bottom:0;
			left:0;
			width:100vw;
			font-size:14px;
			text-align:center;
			color:#f5deb3 !important;
		}
		#footer > *{
			font-size:14px !important;
			color:#f5deb3 !important;
			opacity:0.3;
			text-decoration:none;
		}
		#notice{
			font-size:11px;
			opacity:0.5;
			text-align:center;
			margin-bottom:8px;
		}
	</style>
	<script>
__WASM_EXEC_JS__
	</script>

<body>
	<input id="fin" type="file" style="display:none;">
	<div>
		<div><p>Click here to select a file.</p></div>
		<input type="password" id="password" class="disabled" placeholder="Password" autocomplete="off"><br>
		<input type="password" id="cpassword" class="disabled" placeholder="Confirm" autocomplete="off"><br>
		<details id="advanced" style="width:300px;margin-bottom:12px;">
			<summary style="cursor:pointer;font-size:14px;opacity:0.7;">Advanced</summary>
			<div id="encOptions" style="margin-top:8px;">
				<label style="display:block;font-size:14px;margin-bottom:6px;cursor:pointer;">
					<input type="checkbox" id="paranoid"> Paranoid mode (slower, stronger)
				</label>
				<textarea id="comments" placeholder="Comments (optional)" maxlength="99999"
					style="width:300px;height:54px;box-sizing:border-box;padding:4px 8px;border:none;border-radius:6px;outline:none;background-color:#30343c;color:#f5deb3;font-size:14px;font-family:inherit;resize:vertical;"></textarea>
				<p style="font-size:11px;opacity:0.5;margin:4px 0 0;">Comments are stored <b>unencrypted</b> in the file.</p>
				<label style="display:block;font-size:14px;margin:8px 0 6px;cursor:pointer;">Keyfiles (optional)</label>
				<input type="file" id="keyfiles" multiple style="width:300px;font-size:13px;color:#f5deb3;">
				<label style="display:block;font-size:14px;margin:6px 0;cursor:pointer;">
					<input type="checkbox" id="keyfileOrdered"> Require correct keyfile order
				</label>
			</div>
			<div id="decKeyfiles" style="display:none;margin-top:8px;">
				<label style="display:block;font-size:14px;margin-bottom:6px;cursor:pointer;">Keyfiles (if this volume uses them)</label>
				<input type="file" id="keyfilesDec" multiple style="width:300px;font-size:13px;color:#f5deb3;">
			</div>
		</details>
		<input type="submit" id="start" class="disabled" value="Start">
		<p id="status" class="disabled" style="margin:0;font-size:16px;">Ready.</p>
		<p id="decComments" style="margin:4px 0 0;font-size:13px;opacity:0.7;"></p>
		<p id="notice">Argon2 uses 1 GiB RAM. May take 5-10 seconds.</p>
	</div>
	<p id="footer"><a href="https://github.com/picocrypt-ng/Picocrypt-NG">What is Picocrypt NG?</a> <a href="https://github.com/picocrypt-ng/Picocrypt-NG/releases/tag/__PICOCRYPT_VERSION__">v__PICOCRYPT_VERSION__</a></p>
	<script>
		(() => {
			"use strict";

			if (!WebAssembly || !WebAssembly.instantiate || !window.crypto || !window.crypto.getRandomValues) {
				document.body.innerHTML = "<h1>Unsupported browser!</h1>";
				return;
			}

			let wasmReady = false;
			let selectedFile = null;

			// UI elements
			const fileInput = document.getElementById("fin");
			const fileBox = document.querySelector("body > div > div");
			const fileLabel = document.querySelector("body > div > div > p");
			const passwordInput = document.getElementById("password");
			const confirmInput = document.getElementById("cpassword");
			const startButton = document.getElementById("start");
			const statusText = document.getElementById("status");
			const encOptions = document.getElementById("encOptions");
			const paranoidInput = document.getElementById("paranoid");
			const commentsInput = document.getElementById("comments");
			const decComments = document.getElementById("decComments");
			const keyfilesInput = document.getElementById("keyfiles");
			const keyfileOrderedInput = document.getElementById("keyfileOrdered");
			const decKeyfiles = document.getElementById("decKeyfiles");
			const keyfilesDecInput = document.getElementById("keyfilesDec");

			async function readKeyfiles(input) {
				const out = [];
				for (const f of input.files) out.push(new Uint8Array(await f.arrayBuffer()));
				return out;
			}

			// File selection
			fileBox.onclick = () => fileInput.click();
			fileInput.onchange = function() {
				if (this.files.length > 0) {
					selectedFile = this.files[0];
					if (selectedFile.size > 1024 * 1024 * 1024) { // 1 GiB
						statusText.innerHTML = "File must be less than 1 GiB!";
						statusText.style.color = "#db2828";
						selectedFile = null;
						return;
					}
					fileLabel.innerHTML = selectedFile.name;
					const isDecrypt = selectedFile.name.endsWith(".pcv");
					encOptions.style.display = isDecrypt ? "none" : "block";
					decKeyfiles.style.display = isDecrypt ? "block" : "none";
					decComments.textContent = "";
					passwordInput.classList.remove("disabled");
					if (!isDecrypt) confirmInput.classList.remove("disabled");
					statusText.classList.remove("disabled");
					passwordInput.focus();
					checkPasswords();
				}
			};

			// Password validation
			function checkPasswords() {
				const pwd = passwordInput.value;
				const cpwd = confirmInput.value;
				const isDecrypt = selectedFile && selectedFile.name.endsWith(".pcv");
				
				if (isDecrypt) {
					// For decryption, only need password
					if (pwd.length > 0 && wasmReady) {
						startButton.classList.remove("disabled");
					} else {
						startButton.classList.add("disabled");
					}
				} else {
					// For encryption, need matching passwords
					if (pwd.length > 0 && pwd === cpwd && wasmReady) {
						startButton.classList.remove("disabled");
					} else {
						startButton.classList.add("disabled");
					}
				}
			}

			passwordInput.oninput = checkPasswords;
			confirmInput.oninput = checkPasswords;

			// Process file
			startButton.onclick = async () => {
				if (!selectedFile || !wasmReady) return;

				fileBox.classList.add("disabled");
				passwordInput.classList.add("disabled");
				confirmInput.classList.add("disabled");
				startButton.classList.add("disabled");
				decComments.textContent = "";
				statusText.innerHTML = "Working... (Argon2 may take a while)";
				statusText.style.color = "#f5deb3";

				const fileData = new Uint8Array(await selectedFile.arrayBuffer());
				const password = passwordInput.value;
				const isDecrypt = selectedFile.name.endsWith(".pcv");

				await new Promise(r => setTimeout(r, 100));

				let res;
				try {
					if (isDecrypt) {
						const kf = await readKeyfiles(keyfilesDecInput);
						res = picocryptDecrypt({ data: fileData, password: password, keyfiles: kf });
					} else {
						const kf = await readKeyfiles(keyfilesInput);
						res = picocryptEncrypt({
							data: fileData, password: password,
							paranoid: paranoidInput.checked, comments: commentsInput.value,
							keyfiles: kf, keyfileOrdered: keyfileOrderedInput.checked
						});
					}
				} catch (e) {
					console.error(e);
					res = { code: -1 };
				}

				if (!res || res.code !== 0) {
					fileBox.classList.remove("disabled");
					passwordInput.classList.remove("disabled");
					if (!isDecrypt) confirmInput.classList.remove("disabled");
					startButton.classList.remove("disabled");

					const errors = {
						1: "Unsupported volume: keyfiles, Reed-Solomon, or splitting. Use the desktop app.",
						2: "Corrupted header, or a deniability volume (open those in the desktop app).",
						3: "Incorrect password.",
						4: "Data is modified or corrupted.",
						5: "Unable to generate random values.",
						6: "Invalid input.",
						7: "This volume requires keyfiles. Add them under Advanced and try again.",
						8: "Incorrect keyfiles for this volume.",
						9: "Those keyfiles cancel out (duplicate). Use distinct keyfiles."
					};
					statusText.innerHTML = errors[res ? res.code : -1] || "Unknown error.";
					statusText.style.color = "#db2828";
					return;
				}

				const outputData = res.data;
				const blob = new Blob([outputData]);
				const a = document.createElement("a");
				a.href = URL.createObjectURL(blob);
				a.download = isDecrypt ? selectedFile.name.replace(".pcv", "") : selectedFile.name + ".pcv";
				document.body.appendChild(a);
				a.click();
				a.remove();
				URL.revokeObjectURL(a.href);

				if (isDecrypt && res.comments) {
					decComments.textContent = "Comments: " + res.comments;
				}

				fileLabel.innerHTML = "Click here to select a file.";
				passwordInput.value = "";
				confirmInput.value = "";
				commentsInput.value = "";
				paranoidInput.checked = false;
				keyfilesInput.value = "";
				keyfilesDecInput.value = "";
				keyfileOrderedInput.checked = false;
				statusText.innerHTML = "Completed!";
				statusText.style.color = "#44b944";
				selectedFile = null;
			};

			// Load WASM
			const go = new Go();
			const wasmBase64 = "__WASM_BASE64__";
			const wasmBinary = Uint8Array.from(atob(wasmBase64), c => c.charCodeAt(0));
			WebAssembly.instantiate(wasmBinary, go.importObject).then(result => {
				go.run(result.instance);
				wasmReady = true;
				checkPasswords();
			});
		})();
	</script>
</body>
</html>
