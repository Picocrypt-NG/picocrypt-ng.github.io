			fileBox.onclick = () => fileInput.click();
			fileInput.onchange = () => {
				if (busy || fileInput.files.length === 0) return;
				readyMessagePending = false;
				clearCredentials();
				selectedFile = fileInput.files[0];
				if (selectedFile.size > 1024 * 1024 * 1024) {
					selectedFile = null;
					fileInput.value = "";
					fileLabel.textContent = "Click here to select a file.";
					status("Select a file of at most 1 GiB.", true);
				} else {
					fileLabel.textContent = selectedFile.name;
					operationInput.value = selectedFile.name.endsWith(".pcv") ? "decrypt" : "encrypt";
					pcv3D1Input.checked = forceDecryptInput.checked = false;
					outputNameInput.value = "";
					decComments.textContent = "";
					status(wasmReady ? "Ready." : "Loading encryption engine...");
					readyMessagePending = !wasmReady;
				}
				updateControls();
				if (selectedFile) passwordInput.focus();
			};
			passwordInput.oninput = confirmInput.oninput = outputNameInput.oninput = keyfilesDecInput.onchange = keyfilesEncInput.onchange = pcv3D1Input.onchange = updateControls;
			operationInput.onchange = () => { clearCredentials(); decComments.textContent = ""; updateControls(); };
			deniabilityInput.onchange = () => { if (deniabilityInput.checked) commentsInput.value = ""; updateControls(); };
			startButton.onclick = () => {
				updateControls();
				if (startButton.disabled) return;
				const isDecrypt = operationInput.value === "decrypt";
				const selectedKeyfiles = (isDecrypt ? keyfilesDecInput : keyfilesEncInput).files;
				if (Number.isSafeInteger(bridgeCapabilities.maxKeyfiles) && selectedKeyfiles.length > bridgeCapabilities.maxKeyfiles) {
					clearCredentials();
					fileInput.value = "";
					status(errors[14], true);
					updateControls();
					return;
				}
				// Snapshot controls before asynchronous reads. JS strings cannot be securely wiped.
				const request = {
					isDecrypt, file: selectedFile, keyfiles: Array.from(selectedKeyfiles),
					options: { password: passwordInput.value, paranoid: paranoidInput.checked,
						comments: commentsInput.value, reedSolomon: reedSolomonInput.checked,
						deniability: !isDecrypt && deniabilityInput.checked, pcv3D1: isDecrypt && pcv3D1Input.checked, forceDecrypt: forceDecryptInput.checked }
				};
				const outputName = isDecrypt
					? (selectedFile.name.endsWith(".pcv") ? selectedFile.name.slice(0, -4) || "decrypted.bin" : selectedFile.name + ".decrypted")
					: deniabilityInput.checked ? outputNameInput.value : selectedFile.name + ".pcv";
				activeOperation = { isDecrypt, outputName };
				busy = true;
				clearCredentials();
				decComments.textContent = "";
				status("Working... (Argon2 may take a while)");
				updateControls();
				try { worker.postMessage(request); }
				catch { finishOperation({ error: "engine" }); }
			};
			window.addEventListener("pagehide", () => {
				clearCredentials();
				stopWorker();
				busy = false;
				activeOperation = null;
				updateControls();
			});
			window.addEventListener("pageshow", event => { if (event.persisted) loadWorker(true); });
			updateControls();
			loadWorker(true);
		})();
	</script>
</body>
</html>
